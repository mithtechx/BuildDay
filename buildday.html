            text-decoration: none;

        section {

            margin-bottom: 20px;

        .profile-image {
            width: 150px;

            object-fit: cover;

        }

            max-width: 500px;

        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            padding: 12px;

            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: rgb(69, 67, 231);
            color: white;
        }
